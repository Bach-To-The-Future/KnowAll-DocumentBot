[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
# Pragmatic profile: strict on our layers, quiet about untyped third parties.
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["backend/core", "backend/models", "backend/services", "backend/integrations", "backend/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids function calls in argument defaults, which is exactly how
# FastAPI declares dependencies and request parts. These calls are evaluated
# once at import and are not mutable shared state, so they are declared
# immutable rather than the rule being switched off — a blanket `ignore =
# ["B008"]` would also hide the genuine mutable-default bugs B008 exists for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Form",
]
