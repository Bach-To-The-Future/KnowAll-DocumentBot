# KnowAll evaluation corpus — manifest
#
# Every document used by eval/run_eval.py is listed here with its sha256.
# eval/corpus/verify.py re-hashes all of them and HARD-FAILS before any eval
# run: a baseline is only comparable if the corpus that produced it is
# byte-identical.
#
# Tiers
#   a  real documents; the headline baseline is reported from tier A alone.
#      Bilingual EN/FR parallel pairs share a `parallel_id` so per-language
#      hit@k compares the same content, not different documents of different
#      difficulty.
#   b  synthetic edge cases authored by eval/corpus/generate_tier_b.py.
#      Reported separately — tier B is deliberately adversarial and would
#      distort a headline number.
#
# Field contract (all required; verify.py rejects entries missing any):
#   path         relative to eval/corpus/
#   sha256       of the file bytes
#   format       file extension
#   language     en | fr
#   parallel_id  shared id linking an EN/FR pair, or null
#   tier         a | b
#   license      SPDX id where known
#   source_url   provenance URL, or the generator that produced it
#   retrieved    ISO date the file entered the corpus
#   exercises    which code paths / question categories this file supports
#
# STATUS: tier A is NOT YET POPULATED — see docs/REMEDIATION_LOG.md,
# PROPOSAL P-1. Tier B alone cannot produce the headline baseline.

# LIMITATIONS (deliberate, recorded rather than hidden):
#   * PPTX is TIER-B ONLY. No redistributable Government of Canada PPTX was
#     available, so slide extraction is exercised only by synthetic content;
#     there is no real-document PPTX coverage in the headline baseline.
#   * Tier-B distractors are adjacent to SYNTHETIC content. Once tier A lands
#     they must be retargeted to the same department as the real documents —
#     against real GC text they are topically unrelated and therefore trivially
#     easy to reject, which inflates abstention accuracy. Tagged
#     `retarget-with-tier-a`.
#   * .xlsx and .pdf are NOT byte-reproducible by the generator (openpyxl and
#     PyMuPDF embed time-varying state). This file is authoritative; the
#     generator refuses to overwrite without --force.

