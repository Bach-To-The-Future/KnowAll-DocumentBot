name: CI

on:
  push:
    branches: [main, dock_contain]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret CI values. Real deployments source these from a secret store;
  # they exist here only so the stack boots deterministically.
  MINIO_ROOT_USER: ci_minio_user
  MINIO_ROOT_PASSWORD: ci_minio_password
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ci_minio_user
  MINIO_SECRET_KEY: ci_minio_password
  MINIO_BUCKET: knowall
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: knowall_collection
  QDRANT_API_KEY: ci-qdrant-key
  OLLAMA_API_URL: http://ollama:11434/api/
  REDIS_URL: redis://redis:6379/0
  BACKEND_URL: http://api:8000
  API_KEY: ci-admin-key
  API_QUERY_KEY: ci-readonly-key
  API_QUERY_KEYS: ci-readonly-key
  SESSION_SECRET: ci-session-secret-at-least-32-chars-long
  AUTH_PASSWORD: ci-password
  AUTH_REQUIRED: "true"
  COOKIE_SECURE: "false"

jobs:
  # ---------------------------------------------------------------- static --
  frontend:
    name: Frontend build + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` requires a committed lockfile and installs it byte-for-byte.
      # It fails the build if package.json and the lockfile disagree — which
      # is exactly the supply-chain guarantee `npm install` does not give.
      - run: npm ci
      # `next build` runs tsc: this is what catches TS contract drift between
      # types/api.ts and the FastAPI schemas.
      - run: npm run build

  backend:
    name: Backend lint + types + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - name: Install dependencies
        # --require-hashes is implied when the file carries hashes, pinning
        # the full transitive tree.
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install ruff mypy
      # Both static steps run from the REPOSITORY ROOT, overriding this job's
      # `working-directory: backend`. That is not cosmetic — it is the whole
      # defect, and it made CI fail every one of the first three times it ran.
      #
      # ruff:  `--config ../pyproject.toml` from backend/ changed how
      #        `src = ["backend"]` resolves, so first-party imports (core,
      #        services, …) were reclassified as third-party and every import
      #        block read as mis-sorted: 35 phantom I001 errors. Auto-discovery
      #        from the root walks up to the same pyproject.toml and resolves
      #        `src` correctly.
      # mypy:  `files = ["backend/core", …]` in pyproject.toml resolves against
      #        the CURRENT WORKING DIRECTORY, not the config file's directory.
      #        From backend/ that became backend/backend/core →
      #        "cannot read file 'backend/core'", exit 2, every run.
      #
      # Neither was a code problem. Both were fixed by running them where their
      # configuration expects to be run.
      - name: Ruff
        working-directory: ${{ github.workspace }}
        run: ruff check .
      - name: Mypy
        working-directory: ${{ github.workspace }}
        run: mypy --config-file pyproject.toml
      - name: Unit tests
        run: pytest -q

  # ------------------------------------------------------------ integration --
  e2e:
    name: E2E (compose + Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for compose
        # Compose interpolates from .env; secrets come from the job env above.
        run: |
          {
            for key in MINIO_ROOT_USER MINIO_ROOT_PASSWORD MINIO_ENDPOINT \
                       MINIO_ACCESS_KEY MINIO_SECRET_KEY MINIO_BUCKET \
                       QDRANT_HOST QDRANT_PORT QDRANT_COLLECTION QDRANT_API_KEY \
                       OLLAMA_API_URL REDIS_URL BACKEND_URL \
                       API_KEY API_QUERY_KEY API_QUERY_KEYS \
                       SESSION_SECRET AUTH_PASSWORD AUTH_REQUIRED COOKIE_SECURE; do
              echo "${key}=${!key}"
            done
          } > .env

      - name: Build images
        run: docker compose build

      # The stack is brought up without waiting on model pulls: the E2E suite
      # stubs the backend at the proxy boundary, so it needs `web` healthy and
      # `api` reachable, not a warm LLM.
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 600

      - name: Stack diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 100

      - name: Run Playwright
        run: |
          docker run --rm --network knowall-bot-networks \
            -e BASE_URL=http://knowall-web:3000 \
            -e AUTH_PASSWORD=${AUTH_PASSWORD} \
            -v "${{ github.workspace }}/frontend:/work" -w /work \
            mcr.microsoft.com/playwright:v1.53.0-jammy \
            bash -c "npm ci && npx playwright test"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------- security ---
  # A scan and a gate are two different obligations, so they are two jobs.
  #
  # The scan ALWAYS runs and always publishes the complete CVE list as an
  # artifact, whatever it finds. The gate fails only on what this repository can
  # actually act on today.
  #
  # WHY SPLIT. A HIGH in a Python dependency is pinned by hash in
  # api/requirements.txt and is fixable in a commit. A HIGH in a transitive
  # Debian package cannot be fixed without moving the base-image digest — which
  # moves the tesseract binary, therefore OCR output, therefore corpus content,
  # therefore every stored vector and every eval baseline (findings #25/#26).
  # That is a proposal, not a CI fix. One pass/fail over both conflates a thing
  # you must do now with a thing you must not do casually.
  #
  # The scan job is deliberately NOT a gate: `exit-code: "0"`. It is evidence.
  # Read the artifact.
  security-scan:
    name: Image scan (report, never gates)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t knowall-api:ci -f backend/api/Dockerfile backend

      # Pinned BY COMMIT SHA, not by tag — same reasoning as the base-image
      # digest pin (finding #25): a mutable tag on a third-party action is
      # arbitrary code that can change under you between runs.
      #
      # This job had NEVER executed. It was written `@0.28.0`, and that version
      # has never existed — the tags carry a `v` prefix. The runner failed at
      # "Set up job" with `unable to find version '0.28.0'`, and nothing
      # surfaced it because the job is gated behind `needs: [frontend, backend]`
      # and the backend job could never pass. Wrong from the day it was written,
      # invisible behind another failure, and cited as a working CI job.
      - name: Trivy — full report (all severities, never fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: knowall-api:ci
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Summarise by layer
        run: python3 backend/scripts/summarise_trivy.py trivy-report.json

      - name: Publish the full CVE list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

  # The gate. Scoped to the application layer — Python dependencies pinned by
  # hash in api/requirements.txt, which a commit can fix today. OS-layer
  # packages are deliberately out of scope here; they are tracked as findings
  # with a base-image proposal attached, not silently tolerated.
  security-gate:
    name: Dependency gate (application layer)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t knowall-api:ci -f backend/api/Dockerfile backend
      - name: Trivy — application dependencies only
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: knowall-api:ci
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
